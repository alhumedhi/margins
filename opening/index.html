<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Margins Opening Titles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Noto+Serif+TC:wght@400;900&display=block" rel="stylesheet">
<style>
  :root { --bg: #ebe3d3; --fg: #2b241f; --muted: #8a7f70; --red: #a8261c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #ebe3d3; --fg: #2b241f; } }
  :root[data-theme="dark"] { --bg: #ebe3d3; --fg: #2b241f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; font-family: "EB Garamond", Georgia, serif; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; }
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: rgba(235,227,211,.55); cursor: pointer; transition: opacity .6s; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .play { font-size: 22px; letter-spacing: .2em; color: var(--fg); }
  .play small { display: block; margin-top: 10px; font-size: 15px; letter-spacing: .08em; color: var(--muted); }
  #controls { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
    max-width: calc(100vw - 32px); opacity: 0; transition: opacity .4s; }
  body:hover #controls, #controls:focus-within { opacity: 1; }
  #controls button { font: inherit; font-size: 15px; color: var(--fg); background: rgba(255,255,255,.5); border: 1px solid rgba(43,36,31,.15); padding: 5px 12px; border-radius: 3px; cursor: pointer; }
  #controls button:hover { border-color: var(--red); }
  body.render #overlay, body.render #controls { display: none; }
  body.render canvas { width: 1920px; height: 1080px; }
  body.render #stage { place-items: start; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="overlay" role="button" tabindex="0" aria-label="Play with sound"><div class="play">Play<small>with sound</small></div></div>
<div id="controls">
  <button data-t="0">Thread</button>
  <button data-t="9">Shanghai</button>
  <button data-t="19">Title</button>
  <button id="pause">Pause</button>
</div>
<script>
'use strict';
/* MARGINS — opening titles. Picture is a pure function of time on a 1920×1080 canvas;
   the score is synthesized with Web Audio on the same clock. */
const W = 1920, H = 1080, FPS = 24, DUR = 32;
const COL = { paper: '#ebe3d3', ink: '#2b241f', red: '#a8261c', thread: '#a3241b' };
const SERIF = '"EB Garamond", Georgia, serif', TC = '"Noto Serif TC", serif';

function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* ---------- timeline ---------- */
const T = {
  sew: [1.2, 6.6], placket: [6.6, 7.6], frogs: [7.9, 8.15, 8.4], draftOut: [8.8, 10.0],
  bundIn: [9.6, 12.0], bundOut: [14.8, 15.8], pudongIn: [16.0, 17.6], cityOut: [18.4, 19.6],
  letters: 19.8, seal: 24.6, cn: 25.9, url: 26.9, end: [29.6, 31.6],
};

/* ---------- polylines: the stitched qipao ---------- */
function samplePath(start, segs) {
  const pts = [start.slice()]; let p = start;
  for (const s of segs) {
    if (s.length === 1) { pts.push(s[0].slice()); p = s[0]; continue; }
    const [c1, c2, e] = s;
    for (let i = 1; i <= 24; i++) { const u = i / 24, v = 1 - u;
      pts.push([v*v*v*p[0] + 3*v*v*u*c1[0] + 3*v*u*u*c2[0] + u*u*u*e[0], v*v*v*p[1] + 3*v*v*u*c1[1] + 3*v*u*u*c2[1] + u*u*u*e[1]]); }
    p = e;
  }
  return pts;
}
const STEP = 2;
function resample(pts) {
  const out = [pts[0].slice()]; let carry = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], d = Math.hypot(b[0] - a[0], b[1] - a[1]); let pos = STEP - carry;
    while (pos <= d) { const u = pos / d; out.push([a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]); pos += STEP; }
    carry = d - (pos - STEP);
  }
  return out;
}
const RIGHT = samplePath([0, 0], [[[40, 2]], [[42, 48]], [[80, 56], [118, 68], [150, 86]], [[176, 100], [196, 124], [206, 150]], [[172, 186]],
  [[166, 206], [163, 228], [161, 252]], [[159, 300], [132, 330], [128, 362]], [[126, 400], [168, 432], [166, 472]],
  [[163, 540], [156, 600], [151, 642]], [[146, 788]], [[100, 791], [40, 793], [0, 793]]]);
const Q = { x: 960, y: 170, s: .92 };
const place = p => [Q.x + p[0] * Q.s, Q.y + p[1] * Q.s];
const QIPAO = resample(RIGHT.concat(RIGHT.slice(0, -1).reverse().map(p => [-p[0], p[1]])).map(place));
const PLACKET = resample(samplePath([-2, 48], [[[-50, 70], [-110, 94], [-152, 112]], [[-162, 140], [-166, 175], [-167, 205]]]).map(place));
const FROGS = [[0, 26], [-70, 81], [-140, 107]].map(place);
const QIPAO_LEN = QIPAO.length * STEP, PLACKET_LEN = PLACKET.length * STEP;

function stitches(g, pts, len, width = 3) {
  const n = Math.min(pts.length, Math.floor(len / STEP)); if (n < 2) return;
  g.save(); g.lineCap = 'round'; g.strokeStyle = COL.thread; g.lineWidth = width; g.beginPath(); let pen = false;
  for (let i = 1; i < n; i++) {
    if (((i * STEP) % 18) < 12) { if (!pen) { g.moveTo(pts[i - 1][0], pts[i - 1][1]); pen = true; } g.lineTo(pts[i][0], pts[i][1]); } else pen = false;
  }
  g.stroke(); g.restore();
}
function frog(g, x, y, a) {
  if (a <= 0) return;
  g.save(); g.translate(x, y); g.globalAlpha = a; g.strokeStyle = COL.thread; g.fillStyle = COL.thread; g.lineWidth = 2.2; g.lineCap = 'round';
  for (const s of [-1, 1]) { g.beginPath(); for (let k = 0; k < Math.PI * 4; k += .2) { const r = 1 + k * .55; g.lineTo(s * 13 + Math.cos(k) * r * s, Math.sin(k) * r); } g.stroke(); }
  g.beginPath(); g.moveTo(-6, 0); g.lineTo(6, 0); g.stroke(); g.beginPath(); g.arc(0, 0, 3, 0, 7); g.fill(); g.restore();
}

/* ---------- Shanghai silhouettes ---------- */
const GY = 760;
const BUND = [
  { x: 150, w: 110, h: 120, top: 'flat' }, { x: 256, w: 84, h: 160, top: 'cupola' }, { x: 336, w: 130, h: 140, top: 'flat' },
  { x: 462, w: 120, h: 200, top: 'stepped' }, { x: 578, w: 96, h: 270, top: 'chinese' }, { x: 670, w: 130, h: 230, top: 'pyramid' },
  { x: 796, w: 104, h: 150, top: 'flat' }, { x: 896, w: 140, h: 195, top: 'clock' }, { x: 1032, w: 190, h: 165, top: 'dome' },
  { x: 1218, w: 110, h: 135, top: 'flat' }, { x: 1324, w: 88, h: 185, top: 'cupola' }, { x: 1408, w: 150, h: 130, top: 'flat' },
  { x: 1554, w: 104, h: 165, top: 'stepped' }, { x: 1654, w: 120, h: 115, top: 'flat' },
];
function bundPath(g, b) {
  const { x, w, h } = b, y = GY, cx = x + w / 2;
  g.rect(x, y - h, w, h); g.rect(x - 3, y - h - 5, w + 6, 6);
  switch (b.top) {
    case 'clock': g.rect(cx - 24, y - h - 110, 48, 110); g.moveTo(cx - 24, y - h - 110); g.lineTo(cx, y - h - 146); g.lineTo(cx + 24, y - h - 110); g.closePath(); break;
    case 'pyramid': g.moveTo(x + 10, y - h - 4); g.lineTo(cx, y - h - 76); g.lineTo(x + w - 10, y - h - 4); g.closePath(); break;
    case 'dome': { const r = w * .19; g.rect(cx - r * 1.2, y - h - 24, r * 2.4, 22); g.moveTo(cx - r, y - h - 22); g.arc(cx, y - h - 22, r, Math.PI, 0); g.closePath(); g.rect(cx - 5, y - h - 22 - r - 14, 10, 16); break; }
    case 'chinese': g.moveTo(x - 14, y - h - 2); g.quadraticCurveTo(x, y - h - 6, x + 10, y - h - 26); g.lineTo(x + w - 10, y - h - 26);
      g.quadraticCurveTo(x + w, y - h - 6, x + w + 14, y - h - 2); g.closePath(); g.moveTo(x + 14, y - h - 24); g.lineTo(cx - 12, y - h - 52); g.lineTo(cx + 12, y - h - 52); g.lineTo(x + w - 14, y - h - 24); g.closePath(); break;
    case 'stepped': for (let i = 1; i <= 3; i++) g.rect(x + i * 14, y - h - i * 28, w - i * 28, 30); break;
    case 'cupola': g.rect(cx - 18, y - h - 24, 36, 22); g.moveTo(cx - 20, y - h - 24); g.arc(cx, y - h - 24, 20, Math.PI, 0); g.closePath(); break;
  }
}
function pudongPath(g) {
  [[150, 70, 150], [226, 60, 210], [292, 90, 170], [470, 70, 240], [546, 64, 300], [820, 76, 260], [900, 60, 330], [1090, 64, 290],
   [1250, 60, 340], [1470, 70, 300], [1560, 80, 230], [1648, 70, 270], [1724, 56, 180]].forEach(([x, w, h]) => g.rect(x, GY - h, w, h));
  { const cx = 700; // Oriental Pearl
    g.moveTo(cx + 50, GY - 180); g.arc(cx, GY - 180, 50, 0, 7); g.moveTo(cx + 34, GY - 380); g.arc(cx, GY - 380, 34, 0, 7);
    g.moveTo(cx + 11, GY - 475); g.arc(cx, GY - 475, 11, 0, 7); g.rect(cx - 7, GY - 470, 14, 470); g.rect(cx - 2, GY - 600, 4, 130);
    g.moveTo(cx - 70, GY); g.lineTo(cx - 20, GY - 150); g.lineTo(cx - 10, GY - 150); g.lineTo(cx - 56, GY); g.closePath();
    g.moveTo(cx + 56, GY); g.lineTo(cx + 10, GY - 150); g.lineTo(cx + 20, GY - 150); g.lineTo(cx + 70, GY); g.closePath(); }
  { const cx = 1010; // Jin Mao
    g.moveTo(cx - 46, GY); for (let i = 0; i < 10; i++) { const hw = 46 - i * 3.4; g.lineTo(cx - hw, GY - i * 46 - 40); g.lineTo(cx - hw + 3, GY - i * 46 - 40); }
    g.lineTo(cx - 4, GY - 520); g.lineTo(cx, GY - 570); g.lineTo(cx + 4, GY - 520);
    for (let i = 9; i >= 0; i--) { const hw = 46 - i * 3.4; g.lineTo(cx + hw - 3, GY - i * 46 - 40); g.lineTo(cx + hw, GY - i * 46 - 40); } g.lineTo(cx + 46, GY); g.closePath(); }
  { const cx = 1180; // SWFC, aperture cut out with even-odd
    g.moveTo(cx - 50, GY); g.lineTo(cx - 20, GY - 560); g.lineTo(cx + 20, GY - 560); g.lineTo(cx + 50, GY); g.closePath();
    g.moveTo(cx - 14, GY - 528); g.lineTo(cx + 14, GY - 528); g.lineTo(cx + 11, GY - 500); g.lineTo(cx - 11, GY - 500); g.closePath(); }
  { const cx = 1370; // Shanghai Tower
    g.moveTo(cx - 60, GY); g.bezierCurveTo(cx - 66, GY - 260, cx - 40, GY - 520, cx - 24, GY - 660);
    g.lineTo(cx + 26, GY - 642); g.bezierCurveTo(cx + 36, GY - 540, cx + 54, GY - 300, cx + 58, GY); g.closePath(); }
}

/* ---------- assets ---------- */
const A = {};
function makePaper(seed) {
  const c = mk(W, H), g = c.getContext('2d'), r = mulberry(seed);
  g.fillStyle = COL.paper; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 50; i++) { const x = r() * W, y = r() * H, rad = 120 + r() * 420, a = .006 + r() * .01;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, r() < .5 ? `rgba(150,120,80,${a})` : `rgba(255,252,244,${a * 2})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2); }
  g.lineCap = 'round';
  for (let i = 0; i < 3500; i++) { const x = r() * W, y = r() * H, l = 4 + r() * 18, a = r() * 7;
    g.strokeStyle = r() < .5 ? `rgba(110,90,60,${.025 + r() * .04})` : `rgba(255,253,246,${.06 + r() * .08})`; g.lineWidth = .5 + r() * .8;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  const v = g.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * 1.1);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(120,95,60,.10)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
  return c;
}
function makeGrain(seed) {
  const c = mk(512, 512), g = c.getContext('2d'), d = g.createImageData(512, 512), r = mulberry(seed);
  for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() + r() - 1) * 90; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
}
function makeSilhouette(pathFn) {
  const c = mk(W, H), g = c.getContext('2d'); g.fillStyle = COL.ink; g.beginPath(); pathFn(g); g.fill('evenodd');
  g.fillRect(100, GY, W - 200, 2); return c;
}
function fitGlyph(g, ch, x, y, w, h) {
  g.save(); g.font = `900 200px ${TC}`; const m = g.measureText(ch);
  const gw = m.actualBoundingBoxLeft + m.actualBoundingBoxRight, gh = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  g.translate(x, y); g.scale(w / gw, h / gh); g.fillText(ch, m.actualBoundingBoxLeft, m.actualBoundingBoxAscent); g.restore();
}
function makeSeal(w, h, chars, seed) {
  const pad = 16, c = mk(w + pad * 2, h + pad * 2), g = c.getContext('2d'), r = mulberry(seed);
  g.translate(pad, pad); g.fillStyle = COL.red; g.beginPath();
  const p = []; for (let i = 0; i <= w; i += 10) p.push([i, (r() - .5) * 2.5]); for (let i = 0; i <= h; i += 10) p.push([w + (r() - .5) * 2.5, i]);
  for (let i = w; i >= 0; i -= 10) p.push([i, h + (r() - .5) * 2.5]); for (let i = h; i >= 0; i -= 10) p.push([(r() - .5) * 2.5, i]);
  p.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.closePath(); g.fill();
  g.globalCompositeOperation = 'destination-out';
  const b = 12, ch = (h - b * 2) / chars.length;
  chars.forEach((k, i) => fitGlyph(g, k, b + 6, b + ch * i + 6, w - b * 2 - 12, ch - 12));
  for (let i = 0; i < 260; i++) { g.globalAlpha = .3 + r() * .6; g.beginPath(); g.arc(r() * w, r() * h, .4 + r() * 1.6, 0, 7); g.fill(); }
  g.globalCompositeOperation = 'source-atop'; g.globalAlpha = 1;
  for (let i = 0; i < 10; i++) { const x = r() * w, y = r() * h, rad = 30 + r() * 60, gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, r() < .5 ? 'rgba(120,15,8,.3)' : 'rgba(235,130,105,.25)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2); }
  return c;
}
const TITLE = {};
function layoutTitle() {
  const g = mk(10, 10).getContext('2d'); g.font = `400 176px ${SERIF}`;
  const track = 40, word = 'MARGINS'; let x = 0; const adv = [];
  for (const ch of word) { const w = g.measureText(ch).width; adv.push([ch, x, w]); x += w + track; }
  const textW = x - track, sealW = 92, gap = 54, x0 = W / 2 - (textW + gap + sealW) / 2;
  Object.assign(TITLE, { baseline: 560, x0, textW, cx: x0 + textW / 2, letters: adv.map(([ch, lx]) => ({ ch, x: x0 + lx })),
    seal: { x: x0 + textW + gap, y: 560 - 170, w: sealW, h: 170 } });
}
async function loadFonts() {
  await Promise.all([[`400 100px ${SERIF}`, 'MARGINSbymargins.comPlay'], [`900 100px ${TC}`, '邊緣'], [`400 100px ${TC}`, '一部關於旗袍的紀錄片']]
    .map(s => document.fonts.load(s[0], s[1]).catch(() => {})));
  await document.fonts.ready;
}
function buildAssets() {
  A.paper = makePaper(11); A.grain = [1, 2, 3].map(makeGrain);
  A.bund = makeSilhouette(g => BUND.forEach(b => bundPath(g, b)));
  A.pudong = makeSilhouette(pudongPath);
  layoutTitle();
  A.seal = makeSeal(TITLE.seal.w, TITLE.seal.h, ['邊', '緣'], 7);
}

/* ---------- picture ---------- */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function renderFrame(tRaw) {
  const fi = Math.floor(tRaw * FPS + 1e-6), t = fi / FPS, g = ctx;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.filter = 'none';
  g.drawImage(A.paper, 0, 0);
  if (t >= DUR) return;
  // a barely-there weave so the paper feels filmed rather than flat
  g.save(); g.translate(Math.sin(t * 1.1) * .8, Math.sin(t * .8 + 1) * .8);

  // 1. the thread
  const da = 1 - eio(prog(t, T.draftOut[0], T.draftOut[1]));
  if (da > 0) {
    g.globalAlpha = da;
    stitches(g, QIPAO, QIPAO_LEN * prog(t, T.sew[0], T.sew[1]));
    stitches(g, PLACKET, PLACKET_LEN * prog(t, T.placket[0], T.placket[1]), 2.6);
    T.frogs.forEach((ft, i) => frog(g, FROGS[i][0], FROGS[i][1], eout(prog(t, ft, ft + .5)) * da));
    g.globalAlpha = 1;
  }

  // 2. Shanghai: the Bund, then Pudong, under one red sun
  const city = prog(t, T.bundIn[0], T.bundIn[1]) * (1 - eio(prog(t, T.cityOut[0], T.cityOut[1])));
  if (city > 0) {
    const sunY = lerp(GY - 120, GY - 330, eout(prog(t, T.bundIn[0], 14)));
    g.save(); g.beginPath(); g.rect(0, 0, W, GY); g.clip();
    g.globalAlpha = .82 * city; g.fillStyle = COL.red; g.beginPath(); g.arc(1290, sunY, 150, 0, 7); g.fill(); g.restore();
    // each skyline rises out of the river, the Bund sinks back before Pudong rises
    const reveal = eout(prog(t, T.bundIn[0], T.bundIn[1] + .6));
    const rise = (img, k) => { if (k <= 0) return; g.save(); g.beginPath(); g.rect(0, 0, W, GY + 3); g.clip();
      g.globalAlpha = city; g.drawImage(img, 0, (1 - k) * 700); g.restore(); };
    rise(A.bund, reveal * (1 - eio(prog(t, T.bundOut[0], T.bundOut[1]))));
    rise(A.pudong, eio(prog(t, T.pudongIn[0], T.pudongIn[1])));
    g.globalAlpha = .9 * city; g.fillStyle = COL.ink; g.fillRect(100, GY, W - 200, 2);
    // a few soft lines on the water
    g.fillStyle = COL.ink;
    for (let k = 0; k < 9; k++) {
      const y = GY + 22 + k * 16, a = .12 * (1 - k / 10) * city * reveal;
      for (let s = 0; s < 6; s++) { const x = 220 + s * 260 + Math.sin(t * .6 + k + s) * 18 + hash(k * 7 + s) * 60, w = 70 + hash(k * 3 + s) * 120 - k * 6;
        g.globalAlpha = a; g.fillRect(x, y, Math.max(20, w), 1.6); }
    }
    g.globalAlpha = .22 * city; g.fillStyle = COL.red; for (let k = 0; k < 6; k++) g.fillRect(1290 - 110 + k * 16 + Math.sin(t + k) * 6, GY + 22 + k * 16, 220 - k * 32, 2);
    g.globalAlpha = 1;
  }

  // 3. title
  if (t > T.letters - .1) {
    const out = 1 - eio(prog(t, T.end[0], T.end[1]));
    g.font = `400 176px ${SERIF}`; g.fillStyle = COL.ink; g.textBaseline = 'alphabetic';
    TITLE.letters.forEach((L, i) => { const u = eout(prog(t, T.letters + i * .32, T.letters + i * .32 + 1.4));
      g.globalAlpha = u * out; g.fillText(L.ch, L.x, TITLE.baseline + 10 * (1 - u)); });
    const S = TITLE.seal;
    if (t > T.seal - .7 && t < T.seal) { // a soft shadow as the seal comes down
      const u = prog(t, T.seal - .7, T.seal); g.save(); g.filter = `blur(${lerp(30, 4, u)}px)`; g.globalAlpha = .18 * u * out; g.fillStyle = '#3a2a20';
      g.fillRect(S.x + lerp(24, 2, u), S.y + lerp(28, 2, u), S.w, S.h); g.restore(); }
    if (t >= T.seal) {

/* ---------- player ---------- */
const isRender = new URLSearchParams(location.search).has('render');
if (isRender) document.body.classList.add('render');
