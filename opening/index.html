<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Margins Opening Titles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..900&family=Courier+Prime&family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@400;900&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0b0908;
    --fg: #ece2cc;
    --muted: #8d8270;
    --red: #b8231a;
    --red-hot: #d8321f;
    --chip: rgba(236, 226, 204, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0b0908; --fg: #ece2cc; }
  }
  :root[data-theme="dark"] { --bg: #0b0908; --fg: #ece2cc; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { font-family: "Courier Prime", ui-monospace, monospace; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; background: #000; }
  #overlay {
    position: fixed; inset: 0; display: grid; place-items: center; text-align: center;
    background: radial-gradient(ellipse at center, rgba(11,9,8,0.35), rgba(11,9,8,0.85));
    cursor: pointer; transition: opacity .5s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .seal {
    width: 132px; height: 132px; margin: 0 auto 22px; background: var(--red);
    display: grid; grid-template-columns: 1fr 1fr; place-items: center; padding: 14px;
    font-family: "Noto Serif TC", serif; font-weight: 900; font-size: 48px; color: #f3e9d6;
    border-radius: 3px; box-shadow: 0 0 0 1px rgba(0,0,0,.4) inset; transform: rotate(-2deg);
    transition: transform .25s;
  }
  #overlay:hover .seal { transform: rotate(0deg) scale(1.04); }
  .seal span { line-height: 1; }
  .play-label { letter-spacing: .32em; font-size: 14px; color: var(--fg); }
  .play-sub { margin-top: 8px; font-size: 12px; letter-spacing: .18em; color: var(--muted); }
  #controls {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center;
    max-width: calc(100vw - 32px); padding: 8px 10px; border-radius: 6px;
    background: rgba(11,9,8,.72); backdrop-filter: blur(6px);
    opacity: 0; transition: opacity .4s; font-size: 12px; letter-spacing: .12em;
  }
  body:hover #controls, #controls:focus-within { opacity: 1; }
  #controls button {
    font: inherit; color: var(--fg); background: var(--chip); border: 1px solid rgba(236,226,204,.15);
    padding: 6px 10px; border-radius: 4px; cursor: pointer; letter-spacing: inherit;
  }
  #controls button:hover { border-color: var(--red-hot); color: #fff; }
  #time { min-width: 64px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  body.render #overlay, body.render #controls { display: none; }
  body.render canvas { width: 1920px; height: 1080px; }
  body.render #stage { place-items: start; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="overlay" role="button" tabindex="0" aria-label="Play the opening sequence with sound">
  <div>
    <div class="seal"><span>播</span><span>邊</span><span>放</span><span>緣</span></div>
    <div class="play-label">PLAY WITH SOUND</div>
    <div class="play-sub" id="loading">LOADING TYPE…</div>
  </div>
</div>
<div id="controls">
  <button data-t="0">LEADER</button>
  <button data-t="4.5">THE DRAFT</button>
  <button data-t="13.6">SHANGHAI 1925</button>
  <button data-t="20.4">SHANGHAI 2026</button>
  <button data-t="25.6">TITLE</button>
  <button id="pause">PAUSE</button>
  <span id="time">00.0</span>
</div>
<script>
'use strict';
/* =====================================================================
   MARGINS — opening title sequence
   Everything here is procedural: picture is drawn to a 1920×1080 canvas
   as a pure function of time, and the score is synthesized with Web Audio
   on the same clock, so the piece can be played live or rendered offline.
   ===================================================================== */
const W = 1920, H = 1080, FPS = 24, DUR = 50;
const COL = {
  paper: '#ebe1cb', ink: '#17120f', red: '#b8231a', redHot: '#d8321f',
  chalk: '#56606c', neon: '#ff3b2a', neonCore: '#ffd9cc',
};
const FONT = {
  bodoni: '"Bodoni Moda", "Didot", serif',
  mono: '"Courier Prime", "Noto Serif TC", monospace',
  brush: '"Ma Shan Zheng", "Noto Serif TC", serif',
  serifTC: '"Noto Serif TC", serif',
};

/* ---------- tiny math kit ---------- */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const ein = t => t * t * t;
const eback = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function cam(g, cx, cy, s, tx = 0, ty = 0) { g.translate(cx + tx, cy + ty); g.scale(s, s); g.translate(-cx, -cy); }

/* ---------- polyline helpers (for stitches + neon draw-on) ---------- */
function samplePath(start, segs) {
  const pts = [start.slice()]; let p = start;
  for (const s of segs) {
    if (s.length === 1) { pts.push(s[0].slice()); p = s[0]; continue; }
    const [c1, c2, e] = s;
    for (let i = 1; i <= 24; i++) {
      const u = i / 24, v = 1 - u;
      pts.push([v * v * v * p[0] + 3 * v * v * u * c1[0] + 3 * v * u * u * c2[0] + u * u * u * e[0],
                v * v * v * p[1] + 3 * v * v * u * c1[1] + 3 * v * u * u * c2[1] + u * u * u * e[1]]);
    }
    p = e;
  }
  return pts;
}
function resample(pts, step = 2) {
  const out = [pts[0].slice()]; let carry = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i]; const d = Math.hypot(b[0] - a[0], b[1] - a[1]);
    let pos = step - carry;
    while (pos <= d) { const u = pos / d; out.push([a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]); pos += step; }
    carry = d - (pos - step);
  }
  out.push(pts[pts.length - 1].slice());
  return out;
}
const STEP = 2;
// stitched line: 13px on, 7px off, drawn up to length len
function strokeStitches(g, pts, len, width = 3.6) {
  const n = Math.min(pts.length, Math.floor(len / STEP));
  if (n < 2) return;
  const path = () => {
    g.beginPath(); let pen = false;
    for (let i = 1; i < n; i++) {
      const on = ((i * STEP) % 20) < 13;
      if (on) { if (!pen) { g.moveTo(pts[i - 1][0], pts[i - 1][1]); pen = true; } g.lineTo(pts[i][0], pts[i][1]); }
      else pen = false;
    }
  };
  g.save(); g.lineCap = 'round';
  g.translate(1.6, 1.8); g.strokeStyle = 'rgba(40,10,5,.18)'; g.lineWidth = width; path(); g.stroke();
  g.translate(-1.6, -1.8); g.strokeStyle = '#9e1b13'; g.lineWidth = width; path(); g.stroke();
  g.translate(-.6, -.7); g.strokeStyle = 'rgba(240,110,80,.55)'; g.lineWidth = width * .35; path(); g.stroke();
  g.restore();
}
function strokePartial(g, pts, len) {
  const n = Math.min(pts.length, Math.floor(len / STEP));
  if (n < 2) return;
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < n; i++) g.lineTo(pts[i][0], pts[i][1]);
}

/* ---------- the qipao pattern (local coords, collar top center = 0,0) ---------- */
const QIPAO_RIGHT = samplePath([0, 0], [
  [[40, 2]], [[42, 48]],
  [[80, 56], [118, 68], [150, 86]],
  [[176, 100], [196, 124], [206, 150]],
  [[172, 186]],
  [[166, 206], [163, 228], [161, 252]],
  [[159, 300], [132, 330], [128, 362]],
  [[126, 400], [168, 432], [166, 472]],
  [[163, 540], [156, 600], [151, 642]],
  [[146, 788]],
  [[100, 791], [40, 793], [0, 793]],
]);
const QIPAO = resample(QIPAO_RIGHT.concat(QIPAO_RIGHT.slice(0, -1).reverse().map(p => [-p[0], p[1]])), STEP);
const PLACKET = resample(samplePath([-2, 48], [[[-50, 70], [-110, 94], [-152, 112]], [[-162, 140], [-166, 175], [-167, 205]]]), STEP);
const QIPAO_LEN = QIPAO.length * STEP, PLACKET_LEN = PLACKET.length * STEP;
const FROGS = [[0, 26], [-62, 77], [-128, 103], [-163, 150], [-166, 192]];

/* ---------- timeline ---------- */
const T = {
  leaderEnd: 4.5,
  sew: [6.0, 10.4], placket: [10.5, 11.6], frogs: [11.75, 12.0, 12.25, 12.5, 12.75], miniSeal: 12.95,
  wipe: [13.3, 13.8],
  burn: [20.2, 20.85, 21.5], year: [20.3, 21.4], powerOff: 25.2,
  title: 25.6,
  slams: [26.4, 26.85, 27.28, 27.68, 28.04, 28.38, 28.72],
  under: [29.4, 30.8], approach: [31.2, 34.0], impact: 34.0,
  cn: 36.2, en: 37.6, url: 40.0, runout: 46.5,
};
const CN_LINE = '一部關於旗袍的紀錄片';
const EN_LINE = 'A DOCUMENTARY ON THE QIPAO & NEO-CHINESE DRESS';
const stitchTimes = (len, t0, t1) => { const a = []; for (let k = 1; k <= Math.floor(len / 20); k++) a.push(t0 + (k * 20 / len) * (t1 - t0)); return a; };

/* =====================================================================
   PRE-RENDERED ASSETS
   ===================================================================== */
const A = {};
function makePaper(seed, base) {
  const c = mk(W, H), g = c.getContext('2d'), r = mulberry(seed);
  g.fillStyle = base; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) {
    const x = r() * W, y = r() * H, rad = 80 + r() * 420, a = .025 + r() * .045, dark = r() < .6;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, dark ? `rgba(120,88,48,${a})` : `rgba(255,250,236,${a})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  g.lineCap = 'round';
  for (let i = 0; i < 7000; i++) {
    const x = r() * W, y = r() * H, l = 4 + r() * 24, a = r() * Math.PI * 2;
    g.strokeStyle = r() < .5 ? `rgba(90,68,38,${.035 + r() * .07})` : `rgba(255,252,240,${.08 + r() * .12})`;
    g.lineWidth = .5 + r() * 1.1; g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(a) * l * .5 + (r() - .5) * 6, y + Math.sin(a) * l * .5 + (r() - .5) * 6, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  for (let i = 0; i < 4500; i++) { g.fillStyle = `rgba(60,40,20,${r() * .12})`; g.fillRect(r() * W, r() * H, 1 + r() * 1.5, 1 + r() * 1.5); }
  const v = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(90,60,25,.22)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  return c;
}
function makeGrain(seed) {
  const c = mk(512, 512), g = c.getContext('2d'), d = g.createImageData(512, 512), r = mulberry(seed);
  for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() + r() + r() - 1.5) * 130; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
}
function makeVignette() {
  const c = mk(W, H), g = c.getContext('2d');
  const v = g.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * 1.0);
  v.addColorStop(0, 'rgba(255,255,255,1)'); v.addColorStop(.6, 'rgba(225,218,205,1)'); v.addColorStop(1, 'rgba(70,60,50,1)');
  g.fillStyle = v; g.fillRect(0, 0, W, H); return c;
}
// fit a single CJK glyph into a box using its real ink bounds
function fitGlyph(g, ch, x, y, w, h, font) {
  g.save(); g.font = font; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  const m = g.measureText(ch);
  const gw = m.actualBoundingBoxLeft + m.actualBoundingBoxRight, gh = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  g.translate(x, y); g.scale(w / gw, h / gh);
  g.fillText(ch, m.actualBoundingBoxLeft, m.actualBoundingBoxAscent);
  g.restore();
}
function makeSeal({ cols, w, h, mode, seed }) {
  const pad = 24, c = mk(w + pad * 2, h + pad * 2), g = c.getContext('2d'), r = mulberry(seed);
  g.translate(pad, pad);
  const rough = (x, y, ww, hh, j) => {
    g.beginPath(); const p = [];
    for (let i = 0; i <= ww; i += 10) p.push([x + i, y + (r() - .5) * j]);
    for (let i = 0; i <= hh; i += 10) p.push([x + ww + (r() - .5) * j, y + i]);
    for (let i = ww; i >= 0; i -= 10) p.push([x + i, y + hh + (r() - .5) * j]);
    for (let i = hh; i >= 0; i -= 10) p.push([x + (r() - .5) * j, y + i]);
    g.moveTo(p[0][0], p[0][1]); p.forEach(q => g.lineTo(q[0], q[1])); g.closePath();
  };
  const font = `900 200px ${FONT.serifTC}`;
  const border = mode === 'baiwen' ? 13 : 15;
  const ncol = cols.length, cw = (w - border * 2) / ncol;
  const glyphs = () => cols.forEach((col, ci) => {
    const x0 = w - border - cw * (ci + 1), chH = (h - border * 2) / col.length;
    col.forEach((ch, ri) => fitGlyph(g, ch, x0 + cw * .07, border + chH * ri + chH * .06, cw * .86, chH * .88, font));
  });
  g.fillStyle = COL.red; g.strokeStyle = COL.red;
  if (mode === 'baiwen') {
    rough(0, 0, w, h, 3.5); g.fill();
    g.globalCompositeOperation = 'destination-out'; glyphs();
  } else {
    rough(4, 4, w - 8, h - 8, 3); g.lineWidth = 8; g.stroke(); glyphs();
  }
  // erosion: paper showing through, chipped edges
  g.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 520; i++) { g.globalAlpha = .35 + r() * .65; g.beginPath(); g.arc(r() * w, r() * h, .4 + r() * 2.2, 0, 7); g.fill(); }
  for (let i = 0; i < 26; i++) {
    const side = Math.floor(r() * 4), u = r();
    const x = side === 0 ? u * w : side === 1 ? w : side === 2 ? u * w : 0;
    const y = side === 0 ? 0 : side === 1 ? u * h : side === 2 ? h : u * h;
    g.globalAlpha = 1; g.beginPath(); g.arc(x, y, 1.5 + r() * 5, 0, 7); g.fill();
  }
  // ink density: darker pools, lighter drag marks
  g.globalCompositeOperation = 'source-atop'; g.globalAlpha = 1;
  for (let i = 0; i < 18; i++) {
    const x = r() * w, y = r() * h, rad = 20 + r() * 70, dark = r() < .55;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, dark ? 'rgba(110,8,4,.45)' : 'rgba(240,120,95,.35)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  return c;
}

/* ---------- Shanghai, 1925: the Bund ---------- */
const GY = 770;
const BUND = [
  { x: 0, w: 120, h: 150, top: 'flat' }, { x: 116, w: 92, h: 200, top: 'cupola' },
  { x: 204, w: 160, h: 175, top: 'flat' }, { x: 360, w: 140, h: 245, top: 'stepped' },
  { x: 497, w: 110, h: 335, top: 'chinese' }, { x: 604, w: 150, h: 285, top: 'pyramid' },
  { x: 750, w: 116, h: 185, top: 'flat' }, { x: 862, w: 160, h: 240, top: 'clock' },
  { x: 1018, w: 220, h: 205, top: 'dome' }, { x: 1234, w: 128, h: 168, top: 'flat' },
  { x: 1358, w: 100, h: 228, top: 'cupola' }, { x: 1454, w: 176, h: 158, top: 'flat' },
  { x: 1626, w: 122, h: 200, top: 'stepped' }, { x: 1744, w: 190, h: 140, top: 'flat' },
];
function bundPath(g, b, y = GY) {
  const { x, w, h } = b;
  g.beginPath(); g.rect(x, y - h, w, h + 4); g.rect(x - 4, y - h - 6, w + 8, 8);
  const cx = x + w / 2;
  switch (b.top) {
    case 'clock': { const tw = 56, tx = cx - tw / 2; g.rect(tx, y - h - 130, tw, 132); g.rect(tx - 6, y - h - 138, tw + 12, 9);
      g.moveTo(tx + 3, y - h - 137); g.lineTo(cx, y - h - 178); g.lineTo(tx + tw - 3, y - h - 137); g.closePath(); g.rect(cx - 1.5, y - h - 204, 3, 30); break; }
    case 'pyramid': g.moveTo(x + 12, y - h - 5); g.lineTo(cx, y - h - 90); g.lineTo(x + w - 12, y - h - 5); g.closePath(); g.rect(cx - 1.5, y - h - 114, 3, 28); break;
    case 'dome': { const r = w * .2; g.rect(cx - r * 1.25, y - h - 30, r * 2.5, 26); g.moveTo(cx - r, y - h - 28); g.arc(cx, y - h - 28, r, Math.PI, 0); g.closePath();
      g.rect(cx - 6, y - h - 28 - r - 18, 12, 22); g.rect(cx - 1.5, y - h - 28 - r - 36, 3, 20); break; }
    case 'chinese': g.moveTo(x - 18, y - h - 2); g.quadraticCurveTo(x - 2, y - h - 6, x + 10, y - h - 30); g.lineTo(x + w - 10, y - h - 30);
      g.quadraticCurveTo(x + w + 2, y - h - 6, x + w + 18, y - h - 2); g.closePath();
      g.moveTo(x + 14, y - h - 28); g.lineTo(x + w * .36, y - h - 62); g.lineTo(x + w * .64, y - h - 62); g.lineTo(x + w - 14, y - h - 28); g.closePath(); break;
    case 'stepped': for (let i = 1; i <= 3; i++) { const ins = i * 16; g.rect(x + ins, y - h - i * 34, w - ins * 2, 36); } g.rect(cx - 1.5, y - h - 132, 3, 32); break;
    case 'cupola': g.rect(cx - 22, y - h - 30, 44, 26); g.moveTo(cx - 24, y - h - 30); g.arc(cx, y - h - 30, 24, Math.PI, 0); g.closePath(); g.rect(cx - 1.5, y - h - 82, 3, 30); break;
  }
}
function bundWindows(g, b, y = GY, bi = 0) {
  const style = bi % 3, sx = [18, 24, 14][style], sy = [27, 46, 22][style], ww = [7, 9, 4][style], wh = [13, 30, 12][style];
  const cols = Math.floor((b.w - 14) / sx), rows = Math.floor((b.h - 34) / sy);
  const ox = b.x + (b.w - (cols - 1) * sx - ww) / 2;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (hash(bi * 977 + r * 31 + c * 7) < (style === 1 ? .05 : .18)) continue;
    if (style === 1) { g.beginPath(); g.roundRect(ox + c * sx, y - b.h + 22 + r * sy, ww, wh, [ww / 2, ww / 2, 0, 0]); g.fill(); }
    else g.fillRect(ox + c * sx, y - b.h + 20 + r * sy, ww, wh);
  }
  if (b.top === 'flat' || b.top === 'dome') { g.fillRect(b.x + 6, y - 16, b.w - 12, 3); }
}
function makeHalftone({ value, spacing, angle, color, w = W, h = H }) {
  const c = mk(w, h), g = c.getContext('2d'); g.fillStyle = color;
  const ca = Math.cos(angle), sa = Math.sin(angle), R = Math.hypot(w, h);
  for (let v = -R; v < R; v += spacing) for (let u = -R; u < R; u += spacing) {
    const x = w / 2 + u * ca - v * sa, y = h / 2 + u * sa + v * ca;
    if (x < -spacing || y < -spacing || x > w + spacing || y > h + spacing) continue;
    const k = value(x, y); if (k <= 0.01) continue;
    g.beginPath(); g.arc(x, y, Math.sqrt(k) * spacing * .62, 0, 7); g.fill();
  }
  return c;
}

/* ---------- Shanghai, 2026: Pudong in neon ---------- */
const GY2 = 800;
function neonElements() {
  const els = [];
  const rect = (x, w, h, on, floors) => els.push({ on, dim: .55, draw: g => {
    g.beginPath(); g.rect(x, GY2 - h, w, h);

const TITLE = { size: 232, track: 30, baseline: 560, letters: [], seal: null };
function layoutTitle() {
  const g = mk(10, 10).getContext('2d'); g.font = `900 ${TITLE.size}px ${FONT.bodoni}`;
  const word = 'MARGINS'; let x = 0; const adv = [];
  for (const ch of word) { const w = g.measureText(ch).width; adv.push([ch, x, w]); x += w + TITLE.track; }
  const textW = x - TITLE.track, sealW = 164, gap = 56, total = textW + gap + sealW;
  const x0 = W / 2 - total / 2;
  TITLE.left = x0; TITLE.right = x0 + textW;
  TITLE.cx = x0 + textW / 2;
  TITLE.seal = { x: x0 + textW + gap, y: TITLE.baseline - 250, w: sealW, h: 304 };
  const r = mulberry(1925);
  TITLE.letters = adv.map(([ch, lx, w]) => {
    const m = g.measureText(ch), pad = 20;
    const asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent;
    const cw = Math.ceil(w + pad * 2), chh = Math.ceil(asc + desc + pad * 2);
    const c = mk(cw, chh), lg = c.getContext('2d');
    lg.font = g.font; lg.textBaseline = 'alphabetic';
    lg.fillStyle = 'rgba(255,255,255,.55)'; lg.fillText(ch, pad + 1.6, pad + asc + 2.2); // deboss highlight
    lg.fillStyle = 'rgba(70,55,40,.35)'; lg.fillText(ch, pad - .8, pad + asc - .8);
    lg.fillStyle = COL.ink; lg.globalAlpha = .9 + r() * .08; lg.fillText(ch, pad, pad + asc); lg.globalAlpha = 1;
    lg.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 260; i++) { lg.globalAlpha = .2 + r() * .7; lg.beginPath(); lg.arc(r() * cw, r() * chh, .3 + r() * 1.6, 0, 7); lg.fill(); }
    for (let i = 0; i < 5; i++) { lg.globalAlpha = .12; const y = r() * chh; lg.fillRect(0, y, cw, 1 + r() * 3); }
    lg.globalCompositeOperation = 'source-over'; lg.globalAlpha = 1;

  });
}

    if (t >= DUR) { playing = false; renderFrame(42); overlay.classList.remove('hidden'); document.querySelector('.play-label').textContent = 'PLAY AGAIN'; return; }
    renderFrame(Math.max(0, t)); timeEl.textContent = Math.max(0, t).toFixed(1).padStart(4, '0');
  })();
}
</script>
</body>
</html>
